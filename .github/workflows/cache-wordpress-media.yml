name: Cache WordPress media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cache-wordpress-media.yml
      - scripts/cache-wordpress-media.mjs

permissions:
  contents: write

concurrency:
  group: cache-wordpress-media
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download WordPress media
        run: node scripts/cache-wordpress-media.mjs
      - name: Verify the site still builds
        run: npm run build
      - name: Commit cached media
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain --untracked-files=normal)" ]; then
            echo "No new media to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/wordpress public/assets/wordpress
          git commit -m "Cache legacy WordPress media"
          git push origin HEAD:main
