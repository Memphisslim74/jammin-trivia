name: Publish scheduled blog posts

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for due posts
        run: node scripts/check-scheduled-posts.mjs
      - name: Trigger Cloudflare Pages when a post becomes due
        run: |
          if git diff --quiet -- content/blog/.published.json; then
            echo "Nothing due"
            exit 0
          fi
          git config user.name "JAMMIN Trivia Scheduler"
          git config user.email "actions@users.noreply.github.com"
          git add content/blog/.published.json
          git commit -m "Publish scheduled blog post"
          git push
